<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو Funzo — Menu</title>
<meta name="description" content="منيو Funzo — قهوة، مشروبات ساخنة وباردة، عصائر، ميلك شيك، حلويات ومخبوزات. Funzo menu in Arabic and English.">
<meta name="theme-color" content="#111113">
<meta property="og:title" content="منيو Funzo — Menu">
<meta property="og:description" content="القهوة والمشروبات والحلويات — الأسعار محدّثة.">
<script>document.documentElement.className += ' js'</script>
<style>
  :root{
    --bg:#FFFFFF;
    --bg-soft:#F4F4F2;
    --ink:#0C0D0F;
    --muted:#6D6E68;
    --dim:#A6A69F;
    --hair:rgba(23,24,27,.09);
    --dot:rgba(23,24,27,.22);

    --black:#111113;
    --white:#FFFFFF;
    --muted-dark:rgba(255,255,255,.58);
    --dim-dark:rgba(255,255,255,.38);
    --hair-dark:rgba(255,255,255,.14);

    --yellow:#E7B84C;
    --pink:#EA8FA4;
    --blue:#78C6DC;
    --olive:#5C7A1E;
    --navy:#1E3A5C;

    --ar:"SF Arabic","Geeza Pro","Noto Naskh Arabic","Droid Arabic Naskh","Segoe UI",system-ui,sans-serif;
    --sans:"Helvetica Neue",Arial,system-ui,sans-serif;
    --serif:ui-serif,Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;background:var(--bg)}
  body{
    margin:0;color:var(--ink);
    font-family:var(--ar);font-size:16px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:34rem;margin:0 auto;padding:0 1.35rem}

  /* ================= ambient background ================= */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .bg .field{position:absolute;inset:-10% 0;transition:transform .1s linear}
  .bg span{position:absolute;border-radius:50%;filter:blur(64px);opacity:.24;will-change:transform}
  .bg .b1{width:26rem;height:26rem;background:var(--yellow);top:-8rem;inset-inline-start:-7rem;animation:drift1 20s ease-in-out infinite}
  .bg .b2{width:23rem;height:23rem;background:var(--pink);top:34%;inset-inline-end:-8rem;animation:drift2 24s ease-in-out infinite}
  .bg .b3{width:22rem;height:22rem;background:var(--blue);bottom:8%;inset-inline-start:14%;animation:drift3 22s ease-in-out infinite}
  .bg .b4{width:18rem;height:18rem;background:var(--olive);bottom:-6rem;inset-inline-end:6%;opacity:.14;animation:drift2 26s ease-in-out infinite reverse}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(3rem,4rem) scale(1.2)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-3.5rem,-2.5rem) scale(1.15)}}
  @keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(2.5rem,-3rem) scale(1.25)}}

  /* ================= brand strip ================= */
  .strip{
    height:4px;background-size:200% 100%;
    background-image:linear-gradient(90deg,var(--yellow) 0 33.33%,var(--pink) 33.33% 66.66%,var(--blue) 66.66% 100%,var(--yellow) 100%);
    animation:slide 9s linear infinite;
  }
  @keyframes slide{to{background-position:-200% 0}}

  /* ================= brand bar ================= */
  .bar{background:var(--black);padding:1rem 0}
  .bar .wrap{display:flex;align-items:center;justify-content:space-between}
  .mark{display:flex;align-items:center;gap:.5rem}
  .mark .logo{width:2.15rem;height:1.55rem;display:block;flex:0 0 auto}
  .mark .word{font-family:var(--sans);font-weight:800;font-size:1.3rem;letter-spacing:.01em;color:var(--white)}
  .tagline{display:flex;align-items:center;gap:.45rem}
  .tagline p{margin:0;font-family:var(--serif);font-size:.8125rem;color:var(--muted-dark);letter-spacing:.03em}
  .cup{width:1.4rem;height:1.4rem;display:block;overflow:visible}

  /* ================= sticky chips ================= */
  nav{
    position:sticky;top:0;z-index:20;background:rgba(244,244,242,.86);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hair);box-shadow:0 8px 24px -18px rgba(23,24,27,.35);
  }
  .chips{display:flex;gap:.5rem;overflow-x:auto;scrollbar-width:none;padding:.7rem 1.35rem;max-width:34rem;margin:0 auto}
  .chips::-webkit-scrollbar{display:none}
  .chips a{
    flex:0 0 auto;padding:.44rem .95rem;border:1.5px solid var(--hair);border-radius:999px;
    color:var(--navy);font-weight:700;text-decoration:none;font-size:.8125rem;white-space:nowrap;
    transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease;
  }
  .chips a:active{transform:scale(.94)}
  .chips a[aria-current="true"]{
    background:var(--black);border-color:var(--black);color:var(--white);
    box-shadow:0 6px 16px -6px rgba(17,17,19,.55);transform:translateY(-1px);
  }
  .chips a:focus-visible{outline:2px solid var(--navy);outline-offset:2px}

  /* ================= content card ================= */
  main.wrap{
    position:relative;z-index:1;background:var(--bg);
    border-radius:1.5rem 1.5rem 0 0;margin-top:-1rem;padding-top:1.9rem;
    box-shadow:0 -16px 40px -28px rgba(23,24,27,.3),0 24px 50px -36px rgba(23,24,27,.18);
  }

  /* ================= sections ================= */
  section{scroll-margin-top:3.5rem;padding-top:2.6rem}
  .js section{
    opacity:0;transform:translateY(16px);
    transition:opacity .5s cubic-bezier(.2,.7,.15,1),transform .5s cubic-bezier(.2,.7,.15,1);
  }
  section.in{opacity:1;transform:none}
  .head{display:flex;align-items:baseline;gap:.6rem;padding-bottom:.7rem;border-bottom:1px solid var(--hair)}
  .head h2{margin:0;font-size:1.15rem;font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:.45rem}
  .head h2::before{content:"";width:.55rem;height:.55rem;border-radius:50%;flex:0 0 auto;background:var(--yellow)}
  section:nth-of-type(3n+2) .head h2::before{background:var(--pink)}
  section:nth-of-type(3n+3) .head h2::before{background:var(--blue)}
  .head span{font-family:var(--serif);font-size:.8125rem;color:var(--olive);letter-spacing:.06em;font-weight:600}

  /* ================= items ================= */
  ul{list-style:none;margin:0;padding:0}
  li{padding:.85rem 0;border-bottom:1px solid var(--hair);transition:background .15s ease}
  li:last-child{border-bottom:0}
  li:active{background:rgba(23,24,27,.04)}
  .row{display:flex;align-items:baseline;gap:.5rem}
  .name{font-weight:700;font-size:1.0625rem;letter-spacing:.005em;color:var(--ink)}
  .dots{flex:1;border-bottom:1px dotted var(--dot);transform:translateY(-.25rem);min-width:1.25rem}
  .p{
    width:2.9rem;text-align:left;flex:0 0 auto;
    font-family:var(--sans);font-weight:600;font-size:.9375rem;
    font-variant-numeric:tabular-nums;letter-spacing:.02em;
    transition:color .2s ease;
  }
  .p.empty{color:var(--dim);font-weight:400}
  li:active .p:not(.empty){color:var(--pink)}

  .en{
    display:block;direction:ltr;text-align:right;font-family:var(--serif);
    font-size:.78rem;color:var(--olive);letter-spacing:.02em;margin-top:.12rem;
    font-style:italic;font-weight:600;
  }
  .opts{margin:.3rem 0 0;color:var(--dim);font-size:.8125rem}
  .opts .en{color:var(--olive);font-size:.72rem;opacity:.75}

  .labels{display:flex;gap:.5rem;margin:.9rem 0 .2rem;color:var(--dim);font-size:.72rem}
  .labels .dots{border:0}
  .labels .p{font-family:var(--ar);font-weight:600}

  .out .name,.out .p,.out .en{color:var(--dim)}
  .out .p{text-decoration:line-through}
  .flag{font-size:.7rem;color:var(--muted);border:1px solid var(--hair);border-radius:3px;padding:0 .35rem;margin-inline-start:.4rem}

  /* ================= footer ================= */
  footer{margin-top:3rem;background:var(--black)}
  footer .wrap{padding:2rem 1.35rem 3rem;color:var(--muted-dark);font-size:.875rem}
  footer p{margin:.35rem 0}
  footer b{color:var(--white);font-family:var(--sans);font-variant-numeric:tabular-nums}
  footer a{color:var(--white)}

  .signoff{display:flex;align-items:flex-end;gap:1rem;margin-bottom:1.4rem}
  .doodle{width:7rem;height:5.5rem;flex:0 0 auto;cursor:pointer;overflow:visible}
  .signoff .line{font-size:1rem;color:var(--white);margin:0 0 .4rem}
  .signoff .sub{font-family:var(--serif);font-size:.78rem;color:var(--dim-dark);font-style:italic;margin:.15rem 0 0;direction:ltr;text-align:right}

  .credit{margin-top:1.4rem;padding-top:1rem;border-top:1px solid var(--hair-dark);
          font-family:var(--serif);font-size:.75rem;color:var(--dim-dark);direction:ltr;text-align:right;letter-spacing:.03em}
  .credit a{color:var(--muted-dark);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.25)}
  .credit a:hover,.credit a:focus-visible{color:var(--white);border-color:var(--white)}

  /* ================= back to top ================= */
  #top{
    position:fixed;bottom:1.1rem;inset-inline-start:1.1rem;z-index:30;
    width:2.6rem;height:2.6rem;border-radius:50%;
    background:var(--black);border:1px solid var(--hair-dark);color:var(--white);
    display:grid;place-items:center;cursor:pointer;
    opacity:0;transform:scale(.85);pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;
  }
  #top.show{opacity:1;transform:none;pointer-events:auto}
  #top svg{width:1rem;height:1rem}

  /* ================= tayel badge ================= */
  #tayel{
    position:fixed;bottom:1.1rem;inset-inline-end:1.1rem;z-index:30;
    display:flex;align-items:center;gap:.4rem;
    background:var(--black);color:var(--white);text-decoration:none;
    padding:.5rem .8rem .5rem .6rem;border-radius:999px;
    border:1px solid var(--hair-dark);
    font-family:var(--sans);font-size:.7rem;font-weight:600;letter-spacing:.01em;
    box-shadow:0 8px 22px -10px rgba(17,17,19,.55);
    animation:rise .5s ease-out .6s both,glow 5s ease-in-out 1.5s infinite;
  }
  #tayel .spark{width:.85rem;height:.85rem;flex:0 0 auto}
  #tayel b{font-weight:800}
  #tayel:hover,#tayel:focus-visible{transform:translateY(-2px)}
  @keyframes glow{
    0%,100%{box-shadow:0 8px 22px -10px rgba(17,17,19,.55)}
    50%{box-shadow:0 8px 22px -8px rgba(234,143,164,.55)}
  }

  /* ================= motion ================= */
  @keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  .bar .mark{animation:rise .5s ease-out both}
  .bar .tagline{animation:rise .5s ease-out .12s both}

  @keyframes steam{
    0%{opacity:0;transform:translateY(1px) scaleY(.5)}
    35%{opacity:.85}
    100%{opacity:0;transform:translateY(-7px) scaleY(1.15)}
  }
  .steam path{transform-origin:bottom;animation:steam 3.4s ease-out infinite}
  .steam path:nth-child(2){animation-delay:1.1s}
  .steam path:nth-child(3){animation-delay:2.2s}

  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes appear{to{opacity:1}}
  .doodle .pour{stroke-dasharray:40;stroke-dashoffset:40}
  .doodle .liquid{opacity:0}
  .doodle.on .pour{animation:draw .9s ease-in forwards}
  .doodle.on .liquid{animation:appear .5s ease-out .75s forwards}

  @media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .doodle .pour{stroke-dashoffset:0}
    .doodle .liquid{opacity:1}
  }
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><div class="field" id="bgField"><span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span></div></div>

<div class="bar">
  <div class="wrap">

  <div class="wrap">

    <div class="signoff">
      <svg class="doodle" id="doodle" viewBox="0 0 120 92" role="img"
           aria-label="رسمة لشخص بيصب قهوة" fill="none"
           stroke="var(--dim-dark)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- head -->
        <path d="M47 24c0-8 5.5-13.5 13-13.5S73 16 73 24c0 8-5 14-13 14s-13-6-13-14z"/>
        <path d="M46.5 21c1-8 6-12 13.5-12S73 13 74 21c-3.5-3-7-4.5-14-4.5S50 18 46.5 21z"/>
        <circle cx="54" cy="24" r="4"/>

        <path d="M60 38v6"/>

<script type="application/ld+json">{{JSONLD}}</script>
<script>
  /* active category chip */
  var links = [].slice.call(document.querySelectorAll('#chips a'));
  var bar = document.getElementById('chips');
  var map = {};
  links.forEach(function (a) { map[a.hash.slice(1)] = a; });

  function setActive(a) {
    if (!a || a.getAttribute('aria-current') === 'true') return;
    links.forEach(function (l) { l.removeAttribute('aria-current'); });
    a.setAttribute('aria-current', 'true');
    bar.scrollTo({ left: a.offsetLeft - (bar.clientWidth - a.clientWidth) / 2, behavior: 'smooth' });
  }

  var io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting) setActive(map[e.target.id]); });
  }, { rootMargin: '-15% 0px -75% 0px' });
  document.querySelectorAll('section').forEach(function (s) { io.observe(s); });

  /* sections ease in on first scroll into view */
  var revealWatch = new IntersectionObserver(function (entries, obs) {
    entries.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add('in'); obs.unobserve(e.target); }
    });
  }, { rootMargin: '0px 0px -8% 0px' });
  document.querySelectorAll('section').forEach(function (s) { revealWatch.observe(s); });

  /* ambient background drifts a little slower than the page scrolls */
  var bgField = document.getElementById('bgField');
  if (bgField && matchMedia('(prefers-reduced-motion: no-preference)').matches) {
    var ticking = false;
    addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        bgField.style.transform = 'translateY(' + (scrollY * -0.06) + 'px)';
        ticking = false;
      });
    }, { passive: true });
  }

  /* the doodle pours when it first comes into view, and again on tap */
  var doodle = document.getElementById('doodle');
  var pourWatch = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) { if (e.isIntersecting) doodle.classList.add('on'); });
  }, { threshold: .6 });
  pourWatch.observe(doodle);

  doodle.addEventListener('click', function () {
    doodle.classList.remove('on');
    void doodle.offsetWidth;
    doodle.classList.add('on');
  });

  /* back to top */
  var topBtn = document.getElementById('top');
  addEventListener('scroll', function () {
    topBtn.classList.toggle('show', scrollY > 700);
  }, { passive: true });
  topBtn.addEventListener('click', function () { scrollTo({ top: 0, behavior: 'smooth' }); });
</script>

</body>
</html>
